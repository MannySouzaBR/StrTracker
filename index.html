<style>
  :root{
    --bg:#111317; --surface:#181b21; --surface-2:#1f232a; --line:#2a2f37; --line-2:#363c46;
    --ink:#eef0f3; --ink-2:#a9b0bb; --ink-3:#737b88;
    --accent:#ff8a3d; --accent-ink:#1a0f06; --accent-soft:rgba(255,138,61,.14);
    --good:#4cc38a; --danger:#ef5f5f;
    --muscle:#2b3038; --muscle-hover:#3a414c;
    --h1:#4a2e1c; --h2:#7a3f17; --h3:#b4561a; --h4:#e8752a; --h5:#ffb07a;
    --radius:14px; --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-font-smoothing:antialiased}
  button,input,select,textarea{font:inherit;color:inherit}
  h1,h2,h3{font-family:Archivo,Inter,sans-serif;margin:0;letter-spacing:-.01em}
  .app{max-width:960px;margin:0 auto;padding:calc(12px + var(--safe-t)) 16px calc(96px + var(--safe-b))}
  header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
  .brand{display:flex;align-items:center;gap:10px}
  .brand-mark{width:34px;height:34px;border-radius:10px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink);font:800 16px Archivo,system-ui,sans-serif}
  .brand h1{font-size:20px;font-weight:800}
  .brand small{display:block;color:var(--ink-3);font-size:12px;margin-top:-2px}
  @media(max-width:480px){.brand small{display:none}}
  .ss-head{display:flex;align-items:flex-start;gap:8px}.ss-head div{flex:1;min-width:0}
  .ph-pill{white-space:nowrap;flex-shrink:0;display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:6px 10px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);cursor:pointer;color:var(--ink-2)}
  .ph-pill .dot{width:8px;height:8px;border-radius:50%;background:var(--ink-3)}
  .ph-pill.on .dot{background:var(--good)}

  nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(17,19,23,.94);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px 8px calc(6px + var(--safe-b))}
  nav.tabs .inner{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
  nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;border-radius:10px;color:var(--ink-3);text-decoration:none;font-size:11.5px;font-weight:600}
  nav.tabs a svg{width:22px;height:22px}
  nav.tabs a.active{color:var(--accent);background:var(--accent-soft)}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
  .section-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:4px 0 12px}
  .section-title h2{font-size:22px}
  @media(max-width:480px){.section-title h2{font-size:19px}.seg button{padding:5px 8px}}
  .muted{color:var(--ink-2)} .faint{color:var(--ink-3)}
  .grid{display:grid;gap:12px}
  .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .spacer{flex:1}

  .btn{border:1px solid var(--line-2);background:var(--surface-2);padding:9px 14px;border-radius:10px;cursor:pointer;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
  .btn:hover{border-color:var(--ink-3)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  .btn.primary:hover{filter:brightness(1.06)}
  .btn.ghost{background:transparent}
  .btn.danger{color:var(--danger);border-color:rgba(239,95,95,.4);background:transparent}
  .btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
  .btn.icon{padding:6px 8px}
  .chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface-2);font-size:13px;cursor:pointer;user-select:none}
  .chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
  .chip.sec.on{background:rgba(255,176,122,.08);border-color:#8a5a3a;color:#ffc59c}
  .tag{font-size:11.5px;padding:2px 8px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2)}
  .tag.pr{background:rgba(76,195,138,.12);border-color:rgba(76,195,138,.4);color:var(--good)}

  input[type=text],input[type=number],input[type=date],select,textarea{background:var(--bg);border:1px solid var(--line-2);border-radius:10px;padding:9px 11px;width:100%;outline:none}
  input:focus,select:focus,textarea:focus{border-color:var(--accent)}
  label.f{display:grid;gap:6px;font-size:13px;color:var(--ink-2);font-weight:500}

  /* ---------- mapa ---------- */
  .map-layout{display:grid;grid-template-columns:1fr;gap:12px}
  @media(min-width:820px){.map-layout{grid-template-columns:1.1fr 1fr}}
  .bodies{display:grid;grid-template-columns:1fr 1fr;gap:4px;align-items:start}
  .bodies figure{margin:0;text-align:center}
  .bodies figcaption{font-size:12px;color:var(--ink-3);margin-top:2px;text-transform:uppercase;letter-spacing:.08em}
  .bodies svg{width:100%;max-height:440px}
  .body-base{fill:#1c2026}
  .m{fill:var(--muscle);stroke:var(--bg);stroke-width:1.6;cursor:pointer;transition:fill .15s}
  .m:hover{filter:brightness(1.35)}
  .m.sel{stroke:var(--ink);stroke-width:2}
  .m[data-h="1"]{fill:var(--h1)} .m[data-h="2"]{fill:var(--h2)} .m[data-h="3"]{fill:var(--h3)} .m[data-h="4"]{fill:var(--h4)} .m[data-h="5"]{fill:var(--h5)}
  .legend{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-3);justify-content:center;margin-top:8px}
  .legend .scale{display:flex;gap:2px}
  .legend .scale i{width:18px;height:10px;border-radius:3px;display:block}
  .seg{display:inline-flex;background:var(--bg);border:1px solid var(--line-2);border-radius:10px;padding:3px}
  .seg button{white-space:nowrap;border:0;background:transparent;padding:5px 10px;border-radius:7px;cursor:pointer;font-size:13px;color:var(--ink-2);font-weight:600}
  .seg button.on{background:var(--surface-2);color:var(--ink)}
  .stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .stat{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
  .stat b{display:block;font:800 22px Archivo,system-ui,sans-serif}
  .stat span{font-size:12px;color:var(--ink-3)}

  .ex-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
  .ex-row:first-child{border-top:0}
  .ex-row .name{font-weight:600}
  .ex-row .meta{font-size:12.5px;color:var(--ink-3)}
  .ex-row .load{font:700 16px Archivo,system-ui,sans-serif;white-space:nowrap}
  .clickable{cursor:pointer}
  .clickable:hover .name{color:var(--accent)}

  /* ---------- treinos ---------- */
  .wk{display:grid;gap:8px}
  .wk-head{display:flex;align-items:center;gap:10px}
  .wk-head h3{font-size:17px}
  .wk-items{display:grid;gap:4px;font-size:13.5px}
  .wk-items div{display:flex;justify-content:space-between;gap:8px;color:var(--ink-2)}
  .wk-items b{color:var(--ink);font-weight:600}

  /* ---------- modal ---------- */
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;display:flex;align-items:flex-end;justify-content:center}
  @media(min-width:700px){.scrim{align-items:center}}
  .modal{background:var(--surface);border:1px solid var(--line-2);width:100%;max-width:620px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + var(--safe-b))}
  @media(min-width:700px){.modal{border-radius:18px}}
  .modal-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
  .modal-head h2{font-size:20px;flex:1}
  .modal-foot{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;position:sticky;bottom:-18px;background:var(--surface);padding:10px 0 0}
  .set-row{display:grid;grid-template-columns:1fr;gap:8px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2)}
  .set-inputs{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:8px}
  .stepper{display:flex;align-items:stretch}
  .stepper input{border-radius:0;text-align:center;min-width:0}
  .stepper button{border:1px solid var(--line-2);background:var(--bg);padding:0 10px;cursor:pointer;font-weight:700}
  .stepper button:first-child{border-radius:10px 0 0 10px;border-right:0}
  .stepper button:last-child{border-radius:0 10px 10px 0;border-left:0}
  .mini{font-size:11.5px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em}

  /* ---------- gráfico ---------- */
  .chart-wrap{position:relative}
  .chart-wrap svg{width:100%;height:auto;display:block}
  .tip{position:absolute;pointer-events:none;background:#0b0c0f;border:1px solid var(--line-2);border-radius:8px;padding:6px 9px;font-size:12.5px;white-space:nowrap;transform:translate(-50%,-110%);opacity:0;transition:opacity .1s}
  .tip b{font-family:Archivo}
  table.hist{width:100%;border-collapse:collapse;font-size:13.5px}
  table.hist th{color:var(--ink-3);font-weight:500;text-align:left;font-size:12px;padding:6px 4px;border-bottom:1px solid var(--line)}
  table.hist td{padding:8px 4px;border-bottom:1px solid var(--line)}
  table.hist td.num{font-variant-numeric:tabular-nums}

  /* ---------- toast / debug ---------- */
  .toast{position:fixed;left:50%;bottom:calc(88px + var(--safe-b));transform:translateX(-50%);background:#0b0c0f;border:1px solid var(--line-2);padding:10px 16px;border-radius:12px;z-index:60;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.4)}
  .celebrate{position:fixed;inset:0;z-index:70;display:grid;place-items:center;pointer-events:none}
  .celebrate .burst{background:var(--accent);color:var(--accent-ink);padding:22px 28px;border-radius:20px;text-align:center;font-family:Archivo;animation:pop .5s ease-out;box-shadow:0 20px 60px rgba(255,138,61,.35)}
  .celebrate .burst b{display:block;font-size:30px;font-weight:800}
  @keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.06)}100%{transform:scale(1);opacity:1}}
  .dbg-ev{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;border-top:1px solid var(--line);padding:8px 0}
  .dbg-ev b{color:var(--accent)}
  .dbg-ev pre{margin:4px 0 0;color:var(--ink-2);white-space:pre-wrap;word-break:break-word}
  .empty{text-align:center;padding:28px 16px;color:var(--ink-2)}
  .empty h3{color:var(--ink);margin-bottom:6px}
  .hide{display:none!important}
</style>
<style>
  .lang-seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .lang-seg button{border:1px solid var(--line-2);background:var(--surface-2);border-radius:14px;padding:16px 12px;cursor:pointer;text-align:center;font-weight:700;font-size:16px}
  .lang-seg button span{display:block;font-size:26px;margin-bottom:4px}
  .lang-seg button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
  @media(max-width:420px){ #phPillText{display:none} }
</style>
</head>

<script>

}

const PH = () => (window.STRTRACKER_PH_ENABLED && window.posthog) ? window.posthog : null;
const eventLog = [];
function track(event, props={}){
  eventLog.unshift({ event, props, at:new Date().toLocaleTimeString(L()) });
  if(eventLog.length > 60) eventLog.pop();
  const ph = PH(); if(ph) ph.capture(event, props);
  if(document.getElementById('dbgList')) renderDebugList();
}
function syncPersonProps(){
  const ph = PH(); if(!ph) return;
  ph.setPersonProperties({
    workouts_count: S.workouts.length,
    sessions_count: S.sessions.length,
    custom_exercises_count: S.exercises.filter(e=>e.custom).length,
    last_session_date: S.sessions.length ? S.sessions[S.sessions.length-1].date : null,
    preferred_language: LANG,
  });
}
/* Identidade: o distinct_id é S.user.id (aleatório, gerado no 1º uso e levado no backup).
   O nome é só uma PROPRIEDADE da pessoa — dois "Lucas" continuam sendo duas pessoas. */
function identifyUser(){
  const ph = PH(); if(!ph || !S.user.name) return;
  ph.identify(S.user.id, { name:S.user.name, preferred_language:LANG }, { first_seen_app_version: APP_VERSION });
  syncPersonProps();
}

  if(!ph) return;
  ph.register({ app_name:'StrTracker', app_version: APP_VERSION, storage_mode: memoryOnly ? 'memory' : 'localStorage', ui_language: LANG });
  identifyUser();
  ph.onFeatureFlags(() => { flags.prCelebration = !!ph.isFeatureEnabled('pr-celebration'); });
}
const flags = { prCelebration:false };
function setLang(lang, source){
  if(!LANGS.includes(lang)) return;
  const prev = LANG; LANG = lang; S.settings.lang = lang; save();
  applyStatic();
  const ph = PH(); if(ph){ ph.register({ ui_language: LANG }); if(S.user.name) syncPersonProps(); }
  if(source !== 'onboarding_preview' && (prev !== lang || source === 'onboarding')) track('language_changed', { language:lang, previous_language:prev, source });
}

/* ---------------- 2b) BACKUP NO GOOGLE DRIVE ----------------
   Google Identity Services (token model) + Drive API v3, escopo drive.file:
   o app só enxerga os arquivos que ele mesmo criou no Drive do usuário.
   A marca appProperties { liftmap:'backup' } fica com o nome antigo para achar backups já feitos. */
const GCFG = window.STRTRACKER_GOOGLE || {};
const DRIVE_ENABLED = !!(GCFG.client_id && GCFG.client_id.indexOf('COLE') !== 0);
const DRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.file';
const BACKUP_NAME = 'StrTracker — backup.json';
const drive = { token:null, expiresAt:0, client:null, busy:false, pending:null };

function loadGIS(){
  if(!DRIVE_ENABLED || window.google?.accounts?.oauth2) return initTokenClient();
  const s = document.createElement('script'); s.src = 'https://accounts.google.com/gsi/client'; s.async = true; s.defer = true;
  s.onload = initTokenClient; s.onerror = () => { drive.loadError = true; };
  document.head.appendChild(s);
}
function initTokenClient(){
  if(!window.google?.accounts?.oauth2 || drive.client) return;
  drive.client = google.accounts.oauth2.initTokenClient({
    client_id: GCFG.client_id, scope: DRIVE_SCOPE,
    callback: resp => {
      const job = drive.pending; drive.pending = null;
      if(resp.error){ track('drive_auth_failed', { error: resp.error }); toast(t('g_fail')); return; }
      drive.token = resp.access_token; drive.expiresAt = Date.now() + (resp.expires_in - 60) * 1000;
      if(!S.settings.driveConnectedOnce){ S.settings.driveConnectedOnce = true; save(); track('drive_connected'); }
      job && job();
    },
    error_callback: err => { drive.pending = null; track('drive_auth_failed', { error: err?.type || 'popup' }); if(err?.type !== 'popup_closed') toast(t('popup_blocked')); },
  });
}
const driveTokenValid = () => drive.token && Date.now() < drive.expiresAt;
// Chame SEMPRE a partir de um clique: o Google abre um pop-up de consentimento.
function withDrive(job){
  if(!DRIVE_ENABLED){ toast(t('drive_not_cfg')); return; }
  if(driveTokenValid()) return job();
  if(!drive.client){ toast(drive.loadError ? t('g_offline') : t('g_loading')); loadGIS(); return; }
  drive.pending = job;
  drive.client.requestAccessToken({ prompt: S.settings.driveConnectedOnce ? '' : 'consent' });
}
async function gapi(path, opts={}){
  const r = await fetch('https://www.googleapis.com' + path, { ...opts, headers:{ Authorization:'Bearer ' + drive.token, ...(opts.headers||{}) } });
  if(r.status === 401){ drive.token = null; throw new Error('auth'); }
  if(!r.ok) throw new Error('http_' + r.status);
  return r.status === 204 ? null : (opts.raw ? r.text() : r.json());
}
async function findBackupFile(){
  const q = encodeURIComponent("appProperties has { key='liftmap' and value='backup' } and trashed=false");
  const res = await gapi(`/drive/v3/files?q=${q}&spaces=drive&orderBy=modifiedTime desc&fields=files(id,name,modifiedTime,size)`);
  return res.files && res.files[0] || null;
}
function backupPayload(){ return JSON.stringify({ ...S, exportedAt:new Date().toISOString(), appVersion:APP_VERSION }); }
async function uploadBackup(trigger){
  if(drive.busy) return; drive.busy = true; renderDriveStatus();
  const body = backupPayload();
  try{
    let file = S.settings.driveFileId ? { id:S.settings.driveFileId } : await findBackupFile();
    if(file){
      try{ await gapi(`/upload/drive/v3/files/${file.id}?uploadType=media`, { method:'PATCH', headers:{'Content-Type':'application/json'}, body }); }
      catch(e){ if(e.message !== 'http_404') throw e; file = null; }   // arquivo apagado no Drive → cria de novo
    }
    if(!file){
      const boundary = 'strtracker' + Date.now();
      const meta = { name:BACKUP_NAME, mimeType:'application/json', appProperties:{ liftmap:'backup' } };
      const multipart = `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(meta)}\r\n--${boundary}\r\nContent-Type: application/json\r\n\r\n${body}\r\n--${boundary}--`;
      file = await gapi('/upload/drive/v3/files?uploadType=multipart&fields=id', { method:'POST', headers:{'Content-Type':`multipart/related; boundary=${boundary}`}, body:multipart });
    }
    S.settings.driveFileId = file.id; S.settings.lastBackupAt = Date.now(); S.settings.backupPending = false; save();
    track('backup_uploaded', { trigger, sessions_count:S.sessions.length, workouts_count:S.workouts.length, size_kb: Math.round(body.length/1024) });
    if(trigger === 'manual') toast(t('backup_saved'));
  }catch(e){
    track('backup_failed', { trigger, stage:'upload', error:e.message });
    if(trigger === 'manual') toast(e.message === 'auth' ? t('g_expired') : t('backup_fail'));
    else { S.settings.backupPending = true; save(); }
  }finally{ drive.busy = false; renderDriveStatus(); }
}
async function startRestore(){
  drive.busy = true; renderDriveStatus();
  try{
    const file = await findBackupFile();
    if(!file){ track('backup_restore_viewed', { found:false }); toast(t('no_backup')); return; }
    const d = JSON.parse(await gapi(`/drive/v3/files/${file.id}?alt=media`, { raw:true }));
    if(!d || d.version !== 1 || !Array.isArray(d.sessions)) throw new Error('format');
    track('backup_restore_viewed', { found:true, backup_sessions:d.sessions.length, local_sessions:S.sessions.length });
    const when = fmtDateTime(Date.parse(d.exportedAt || file.modifiedTime));
    openModal(`<div class="modal-head"><h2>${t('restore_title')}</h2><button class="btn icon ghost" data-action="close" aria-label="${t('close')}">✕</button></div>
      <div class="stat-row" style="margin-bottom:12px"><div class="stat"><b>${d.sessions.length}</b><span>${t('st_sessions')}</span></div><div class="stat"><b>${d.workouts.length}</b><span>${t('st_workouts')}</span></div><div class="stat"><b>${d.exercises.filter(e=>e.custom).length}</b><span>${t('st_custom')}</span></div></div>
      <p class="muted">${t('backup_from', { w:when })}${S.sessions.length ? t('will_replace', { n:S.sessions.length }) : ''}</p>
      <div class="modal-foot"><button class="btn ghost" data-action="close">${t('cancel')}</button><button class="btn primary" id="doRestore">${t('restore_here')}</button></div>`,
      m => m.querySelector('#doRestore').onclick = () => {
        const settings = { ...S.settings, driveFileId:file.id, lastBackupAt:Date.parse(d.exportedAt || file.modifiedTime) || Date.now(), lang:LANG, onboarded:true };
        delete d.exportedAt; delete d.appVersion;
        S = migrate(d); S.settings = { ...S.settings, ...settings }; save();
        // mesmo user.id do backup → o PostHog junta este aparelho à mesma pessoa
        identifyUser(); syncPersonProps();
        track('backup_restored', { sessions_count:S.sessions.length, workouts_count:S.workouts.length });
        closeModal(); toast(t('restored')); location.hash = '#mapa'; route();
      });
  }catch(e){
    track('backup_failed', { trigger:'manual', stage:'restore', error:e.message });
    toast(e.message === 'auth' ? t('g_expired') : t('restore_fail'));
  }finally{ drive.busy = false; renderDriveStatus(); }
}

  if(driveTokenValid()) uploadBackup('auto');

/* ---------------- 3) CÁLCULOS ---------------- */
const e1rm = (load, reps) => reps <= 1 ? load : load * (1 + reps/30);  // fórmula de Epley
function sortedSessions(){ return [...S.sessions].sort((a,b) => a.date.localeCompare(b.date) || (a.startedAt||0)-(b.startedAt||0)); }
function historyFor(exId){
  const out = [];
  for(const s of sortedSessions()) for(const e of s.entries) if(e.exerciseId === exId) out.push({ ...e, date:s.date, sessionId:s.id });
  return out;
}
function lastEntry(exId){ const h = historyFor(exId); return h[h.length-1] || null; }
function bestLoad(exId, exceptSessionId){
  let best = 0; for(const h of historyFor(exId)) if(h.sessionId !== exceptSessionId) best = Math.max(best, +h.load||0); return best;
}
/* Faixas de repetição: cada registro cai numa faixa pelo nº de reps da série. */
const REP_BANDS = [
  { id:'max',    name:['Max','Máximo'],             short:'1RM',  min:1,  max:1 },
  { id:'low',    name:['Low volume','Baixo volume'], short:'2–5',  min:2,  max:5 },
  { id:'midlow', name:['Mid-low','Médio-baixo'],     short:'6–8',  min:6,  max:8 },
  { id:'normal', name:['Normal','Normal'],           short:'9–12', min:9,  max:12 },
  { id:'high',   name:['High volume','Alto volume'], short:'13+',  min:13, max:Infinity },
];
const bandName = b => b.name[LANGS.indexOf(LANG)];
const bandOf = reps => REP_BANDS.find(b => +reps >= b.min && +reps <= b.max) || REP_BANDS[REP_BANDS.length-1];
const bandById = id => REP_BANDS.find(b => b.id === id);
const inBand = (e, band) => !band || band === 'all' || bandOf(e.reps).id === band;
function bestByBand(exId, exceptSessionId){
  const out = {};
  for(const h of historyFor(exId)){ if(h.sessionId === exceptSessionId) continue;
    const b = bandOf(h.reps).id; if(!out[b] || +h.load > out[b].load || (+h.load === out[b].load && +h.reps > out[b].reps)) out[b] = { load:+h.load, reps:+h.reps, date:h.date }; }
  return out;
}
function bandChips(exId, focus){
  const bb = bestByBand(exId);
  return REP_BANDS.filter(b => bb[b.id]).map(b => `<span class="tag" style="${focus===b.id?'border-color:var(--accent);color:var(--accent)':''}">${b.short} · ${fmtKg(bb[b.id].load)}</span>`).join(' ');
}
function muscleVolume(days, band='all'){
  const since = new Date(); since.setDate(since.getDate() - days + 1);
  const sinceISO = since.toISOString().slice(0,10);
  const vol = {}; MUSCLE_ORDER.forEach(m => vol[m] = 0);
  for(const s of S.sessions){ if(s.date < sinceISO) continue;
    for(const e of s.entries){ const ex = exById(e.exerciseId); if(!ex || !inBand(e, band)) continue;
      const sets = +e.sets||0;   // séries efetivas por músculo (primário = 1, secundário = 0,5)
      ex.primary.forEach(m => vol[m] += sets);
      ex.secondary.forEach(m => vol[m] += sets*0.5);
    } }
  return vol;
}
function heatLevel(v, max){ if(!v) return 0; const r = v/max; return r>.8?5 : r>.6?4 : r>.4?3 : r>.2?2 : 1; }
// recorde = carga acima do melhor anterior DO MESMO exercício NA MESMA faixa de reps
function countPRs(days, band='all'){
  const since = new Date(); since.setDate(since.getDate()-days+1); const sinceISO = since.toISOString().slice(0,10);
  const best = {}; let n = 0;
  for(const s of sortedSessions()) for(const e of s.entries){
    const key = e.exerciseId + '|' + bandOf(e.reps).id, prev = best[key];
    if(prev !== undefined && +e.load > prev && s.date >= sinceISO && inBand(e, band)) n++;
    best[key] = Math.max(prev ?? 0, +e.load||0);
  }
  return n;
}

function musclePanel(m, v){
  const list = S.exercises.filter(e => e.primary.includes(m) || e.secondary.includes(m))
    .sort((a,b) => (b.primary.includes(m)-a.primary.includes(m)) || ((lastEntry(b.id)?1:0)-(lastEntry(a.id)?1:0)));
  return `<div class="row" style="margin-bottom:6px"><h3 style="font-size:18px;flex:1">${mName(m)}</h3><span class="tag">${t('sets_tag',{n:fmtNum(v||0),d:ui.range})}${ui.band==='all'?'':' · '+bandById(ui.band).short}</span></div>
    <div>${list.map(e => exRow(e, e.primary.includes(m), ui.band, true)).join('') || `<p class="faint">${t('no_ex_mapped')}</p>`}</div>
    <div class="row" style="margin-top:10px"><button class="btn sm" data-action="new-exercise" data-muscle="${m}">${t('add_ex_for',{m:mName(m).toLowerCase()})}</button></div>`;
}
function exRow(e, isPrimary=true, band='all', showBands=false){
  const hist = historyFor(e.id).filter(x => inBand(x, band));
  const last = hist[hist.length-1] || null, best = hist.reduce((a,x)=>Math.max(a,+x.load||0),0);
  const chips = showBands ? bandChips(e.id, band) : '';
  return `<div class="ex-row clickable" data-action="open-exercise" data-id="${e.id}">
    <div style="flex:1;min-width:0"><div class="name">${esc(exName(e))}</div>
      <div class="meta">${isPrimary?t('primary'):t('secondary')}${last ? t('last_on',{d:fmtDate(last.date), sr:`${last.sets}×${last.reps}`}) : (band==='all' ? t('no_records') : t('no_records_band',{b:bandById(band).short}))}</div>
      ${chips?`<div class="row" style="gap:4px;margin-top:5px">${chips}</div>`:''}</div>
    ${last?`<div style="text-align:right"><div class="load">${fmtKg(last.load)}</div>${best>last.load?`<div class="meta">${t('record_x',{x:fmtKg(best)})}</div>`:(best?`<span class="tag pr">${t('at_record')}</span>`:'')}</div>`:''}
  </div>`;
}

function sparkline(vals){
  if(vals.length < 2) return '<svg width="80" height="28"></svg>';
  const w=80,h=28,p=3, mn=Math.min(...vals), mx=Math.max(...vals), r=(mx-mn)||1;
  const pts = vals.map((v,i)=>[p+i*(w-2*p)/(vals.length-1), h-p-(v-mn)/r*(h-2*p)]);
  return `<svg width="${w}" height="${h}" aria-hidden="true"><polyline fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" points="${pts.map(q=>q.join(',')).join(' ')}"/><circle cx="${pts[pts.length-1][0]}" cy="${pts[pts.length-1][1]}" r="2.5" fill="var(--accent)"/></svg>`;
}

/* ---------------- 6) MODAIS ---------------- */
const layer = () => document.getElementById('layer');
let modalRerender = null;   // permite redesenhar o modal aberto ao trocar de idioma
function openModal(html, onMount){
  layer().innerHTML = `<div class="scrim" data-action="scrim"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`;
  document.body.style.overflow = 'hidden';
  modalRerender = null;
  onMount && onMount(layer().querySelector('.modal'));
}
function closeModal(){ layer().innerHTML = ''; document.body.style.overflow = ''; modalRerender = null; releaseWakeLock(); }
const closeBtn = () => `<button class="btn icon ghost" data-action="close" aria-label="${t('close')}">✕</button>`;
/* Mantém a tela ligada enquanto você registra o treino (Screen Wake Lock API) */
let wakeLock = null;
async function keepScreenOn(){ try{ if('wakeLock' in navigator){ wakeLock = await navigator.wakeLock.request('screen'); } }catch(e){} }
function releaseWakeLock(){ try{ wakeLock && wakeLock.release(); }catch(e){} wakeLock = null; }
function confirmBox(msg, okLabel, onOk){
  openModal(`<div class="modal-head"><h2>${t('confirm')}</h2></div><p class="muted">${msg}</p>
    <div class="modal-foot"><button class="btn ghost" data-action="close">${t('cancel')}</button><button class="btn danger" id="okBtn">${okLabel}</button></div>`,
    m => m.querySelector('#okBtn').onclick = () => { closeModal(); onOk(); });
}
function toast(msg){ document.querySelectorAll('.toast').forEach(x=>x.remove()); const el = document.createElement('div'); el.className='toast'; el.textContent = msg; document.body.appendChild(el); setTimeout(()=>el.remove(), 2400); }
function celebrate(pr){
  const c = document.createElement('div'); c.className = 'celebrate';
  c.innerHTML = `<div class="burst">${t('pr_burst',{b:pr.band.short})}<b>${esc(pr.name)}</b>${fmtKg(pr.previous)} → ${fmtKg(pr.load)}</div>`;
  document.body.appendChild(c); setTimeout(()=>c.remove(), 2600);
}
function exerciseOptions(selectedId){
  return MUSCLE_ORDER.map(m => {
    const list = S.exercises.filter(e=>e.primary[0]===m); if(!list.length) return '';
    return `<optgroup label="${mName(m)}">${list.map(e=>`<option value="${e.id}" ${e.id===selectedId?'selected':''}>${esc(exName(e))}</option>`).join('')}</optgroup>`;
  }).join('');
}
function stepper(name, value, step){
  return `<div class="stepper"><button type="button" data-step="-${step}" data-for="${name}">−</button><input type="number" inputmode="decimal" step="any" min="0" name="${name}" value="${value}"><button type="button" data-step="${step}" data-for="${name}">+</button></div>`;
}

      </div>`).join('') || `<p class="faint" style="margin:0">${t('add_first_ex')}</p>`}</div>

    m.querySelector('#addExBtn').onclick = () => { pull(); const exId = m.querySelector('#addEx').value; const last = lastEntry(exId);
      draft.items.push({ exerciseId:exId, sets: last?.sets||3, reps: last?.reps||10, load: last?.load||0 }); render(m); };
    m.querySelectorAll('[data-remove]').forEach(b => b.onclick = () => { pull(); draft.items.splice(+b.dataset.remove,1); render(m); });
    m.querySelectorAll('[data-move]').forEach(b => b.onclick = () => { pull(); const i=+b.dataset.i, j=i+(+b.dataset.move); if(j<0||j>=draft.items.length) return; [draft.items[i],draft.items[j]]=[draft.items[j],draft.items[i]]; render(m); });

/* ---- registrar / editar sessão ---- */
function openSession({ workoutId=null, sessionId=null, exerciseId=null, source='workout' }={}){
  const existing = sessionId ? S.sessions.find(s=>s.id===sessionId) : null;
  const wk = workoutId ? wkById(workoutId) : null;
  let draft;
  if(existing) draft = JSON.parse(JSON.stringify(existing));
  else {
    const items = wk ? wk.items : (exerciseId ? [{ exerciseId }] : []);
    draft = { id:uid('ss'), date:todayISO(), workoutId:wk?wk.id:null, startedAt:Date.now(),
      entries: items.map(it => { const last = lastEntry(it.exerciseId);
        return { exerciseId:it.exerciseId, load: it.load ?? last?.load ?? 0, sets: it.sets ?? last?.sets ?? 3, reps: it.reps ?? last?.reps ?? 10 }; }) };
    track('session_started', { source, workout_id: draft.workoutId, planned_exercise_count: draft.entries.length });
  }
  let pull = () => {};
  const render = (m) => {
    m.innerHTML = `<div class="modal-head"><h2>${existing?t('edit_session'):(wk?esc(wkName(wk)):t('one_off'))}</h2>${closeBtn()}</div>
      <label class="f" style="max-width:200px">${t('date')}<input type="date" id="ssDate" value="${draft.date}"></label>
      <div class="grid" id="ssItems" style="margin-top:14px">${draft.entries.map((e,i) => { const ex = exById(e.exerciseId); const last = lastEntry(e.exerciseId);
        return `<div class="set-row" data-i="${i}">
          <div class="row" style="flex-wrap:nowrap"><b style="flex:1">${esc(exName(ex))}</b><button class="btn icon sm danger" data-remove="${i}" aria-label="${t('remove')}">✕</button></div>
          <div class="faint" style="font-size:12.5px;margin-top:-4px">${last && !existing ? t('prev_entry',{sr:`${last.sets}×${last.reps}`, kg:fmtKg(last.load)}) : ''}<span data-hint="${i}">${sessionHint(e, draft.id)}</span></div>
          <div class="set-inputs"><label class="f">${t('load_kg')}${stepper('load_'+i, e.load, 2.5)}</label><label class="f">${t('sets_l')}<input type="number" min="1" data-f="sets" value="${e.sets}"></label><label class="f">${t('reps_l')}<input type="number" min="1" data-f="reps" value="${e.reps}"></label></div>
        </div>`; }).join('') || `<p class="faint" style="margin:0">${t('add_done_ex')}</p>`}</div>
      <div class="row" style="margin-top:10px"><select id="addEx">${exerciseOptions()}</select><button class="btn" id="addExBtn">${t('add')}</button></div>
      ${wk && !existing ? `<label class="row" style="margin-top:14px;font-size:13.5px;color:var(--ink-2);cursor:pointer"><input type="checkbox" id="updTpl" ${draft.updTpl===false?'':'checked'} style="width:auto"> ${t('update_tpl')}</label>`:''}
      <div class="modal-foot">${existing?`<button class="btn danger" id="delSs">${t('del')}</button><span class="spacer"></span>`:''}<button class="btn ghost" data-action="close">${t('cancel')}</button><button class="btn primary" id="saveSs">${existing?t('save'):t('finish_workout')}</button></div>`;
    m.querySelectorAll('#ssItems .set-row').forEach(row => {
      const upd = () => { const i = +row.dataset.i, e = { ...draft.entries[i], load: +row.querySelector(`[name=load_${i}]`).value || 0, reps: +row.querySelector('[data-f=reps]').value || 1 };
        row.querySelector('[data-hint]').innerHTML = sessionHint(e, draft.id); };
      row.addEventListener('input', upd); row.addEventListener('click', ev => { if(ev.target.closest('[data-step]')) setTimeout(upd, 0); });
    });
    pull = () => { draft.date = m.querySelector('#ssDate').value || todayISO();
      const u = m.querySelector('#updTpl'); if(u) draft.updTpl = u.checked;
      m.querySelectorAll('#ssItems .set-row').forEach(row => { const e = draft.entries[+row.dataset.i];
        e.load = +row.querySelector(`[name=load_${row.dataset.i}]`).value || 0; e.sets = +row.querySelector('[data-f=sets]').value || 1; e.reps = +row.querySelector('[data-f=reps]').value || 1; }); };
    m.querySelector('#addExBtn').onclick = () => { pull(); const exId = m.querySelector('#addEx').value; const last = lastEntry(exId);
      draft.entries.push({ exerciseId:exId, load:last?.load||0, sets:last?.sets||3, reps:last?.reps||10 }); render(m); };
    m.querySelectorAll('[data-remove]').forEach(b => b.onclick = () => { pull(); draft.entries.splice(+b.dataset.remove,1); render(m); });
    m.querySelector('#saveSs').onclick = () => { pull();
      const updTpl = draft.updTpl !== false && !!wk && !existing; delete draft.updTpl;
      if(!draft.entries.length){ toast(t('add_one_ex')); return; }
      if(existing){ Object.assign(existing, draft); save(); track('session_updated', { session_id:draft.id, exercise_count:draft.entries.length }); closeModal(); toast(t('session_updated')); route(); autoBackupAfterChange(); return; }
      // recordes por faixa: compara com o melhor histórico ANTES de salvar
      const prs = draft.entries.map(e => { const band = bandOf(e.reps), prev = bestByBand(e.exerciseId)[band.id], ex = exById(e.exerciseId);
        return (prev && prev.load > 0 && e.load > prev.load) ? { exerciseId:e.exerciseId, name:exName(ex), nameEn:exNameEn(ex), load:e.load, reps:e.reps, previous:prev.load, band, allTime: e.load > bestLoad(e.exerciseId) } : null; }).filter(Boolean);
      draft.finishedAt = Date.now(); S.sessions.push(draft);
      if(updTpl){ wk.items.forEach(it => { const e = draft.entries.find(x=>x.exerciseId===it.exerciseId); if(e){ it.load=e.load; it.sets=e.sets; it.reps=e.reps; } }); }
      save(); syncPersonProps();
      const volume = draft.entries.reduce((a,e)=>a+e.load*e.sets*e.reps,0);
      track('session_completed', { session_id:draft.id, workout_id:draft.workoutId, source, exercise_count:draft.entries.length,
        total_sets:draft.entries.reduce((a,e)=>a+e.sets,0), total_volume_kg:Math.round(volume), pr_count:prs.length,
        duration_min: Math.round((draft.finishedAt-draft.startedAt)/60000), template_updated: updTpl });
      prs.forEach(p => track('personal_record_set', { exercise_id:p.exerciseId, exercise_name:p.nameEn, load_kg:p.load, reps:p.reps, previous_kg:p.previous,
        rep_range:p.band.id, rep_range_label:p.band.short, is_all_time_best:p.allTime, improvement_pct: Math.round((p.load-p.previous)/p.previous*1000)/10 }));
      closeModal(); route();
      if(prs.length){ if(flags.prCelebration) celebrate(prs[0]); else toast(t('pr_toast',{b:prs[0].band.short, n:prs[0].name, kg:fmtKg(prs[0].load)})); }
      else toast(t('workout_logged'));
      autoBackupAfterChange();
    };
    if(existing) m.querySelector('#delSs').onclick = () => confirmBox(t('confirm_del_ss'), t('del'), () => {
      S.sessions = S.sessions.filter(s=>s.id!==existing.id); save(); syncPersonProps(); track('session_deleted', { session_id:existing.id }); route(); });
  };
  openModal('', render);
  modalRerender = m => { pull(); render(m); };
  if(!existing) keepScreenOn();
}
function sessionHint(e, sessionId){
  const band = bandOf(e.reps), prev = bestByBand(e.exerciseId, sessionId)[band.id];
  if(!prev) return t('hint_first',{b:band.short});
  const beat = +e.load > prev.load;
  return t('hint_rec',{b:band.short, kg:fmtKg(prev.load)}) + (beat ? ` · <span style="color:var(--good);font-weight:600">${t('new_record')}</span>` : '');
}

function lineChart(pts){
  const W=560, H=220, L0=44, R=14, T=14, B=28;
  const vals = pts.map(p=>p.v), mn0 = Math.min(...vals), mx0 = Math.max(...vals);
  const pad = Math.max(2.5, (mx0-mn0)*0.15); const mn = Math.max(0, Math.floor((mn0-pad)/5)*5), mx = Math.ceil((mx0+pad)/5)*5;
  const x = i => pts.length===1 ? (L0+W-R)/2 : L0 + i*(W-L0-R)/(pts.length-1);
  const y = v => T + (1-(v-mn)/((mx-mn)||1))*(H-T-B);
  const ticks = 4; const grid = Array.from({length:ticks+1},(_,i)=> mn + i*(mx-mn)/ticks);
  const xl = pts.length<=6 ? pts.map((_,i)=>i) : [0, Math.floor((pts.length-1)/2), pts.length-1];
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${t('chart_aria')}">
    ${grid.map(g=>`<line x1="${L0}" x2="${W-R}" y1="${y(g)}" y2="${y(g)}" stroke="var(--line)" stroke-width="1"/><text x="${L0-8}" y="${y(g)+4}" text-anchor="end" font-size="11" fill="var(--ink-3)">${Math.round(g)}</text>`).join('')}
    ${xl.map(i=>`<text x="${x(i)}" y="${H-8}" text-anchor="${pts.length===1?'middle':i===0?'start':i===pts.length-1?'end':'middle'}" font-size="11" fill="var(--ink-3)">${fmtDate(pts[i].date)}</text>`).join('')}
    <polyline fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" points="${pts.map((p,i)=>`${x(i)},${y(p.v)}`).join(' ')}"/>
    <line id="xhair" x1="0" x2="0" y1="${T}" y2="${H-B}" stroke="var(--ink-3)" stroke-dasharray="3 3" opacity="0"/>
    ${pts.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p.v)}" r="4" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>`).join('')}
    <text x="${x(pts.length-1)}" y="${y(pts[pts.length-1].v)-10}" text-anchor="${pts.length>1?'end':'middle'}" font-size="12" font-weight="700" fill="var(--ink)">${fmtKg(pts[pts.length-1].v)}</text>
    ${pts.map((p,i)=>{ const w=(W-L0-R)/Math.max(1,pts.length-1); return `<rect class="hit" data-i="${i}" data-x="${x(i)}" data-y="${y(p.v)}" data-t="${fmtDate(p.date)}|${fmtKg(p.v)}|${p.label}" x="${x(i)-w/2}" y="${T}" width="${w}" height="${H-T-B}" fill="transparent"/>`; }).join('')}
  </svg>`;
}
function bindChart(m){
  const wrap = m.querySelector('#chart'); if(!wrap) return; const svg = wrap.querySelector('svg'), tip = wrap.querySelector('#tip'), xh = svg.querySelector('#xhair');
  const show = r => { const sc = svg.getBoundingClientRect().width / 560; const [d,v,l] = r.dataset.t.split('|');
    tip.innerHTML = `<b>${v}</b> · ${l}<br><span class="faint">${d}</span>`; const tw = tip.offsetWidth || 120, cw = wrap.clientWidth; tip.style.left = Math.min(cw - tw/2, Math.max(tw/2, +r.dataset.x*sc))+'px'; tip.style.top = (+r.dataset.y*sc)+'px'; tip.style.opacity = 1;
    xh.setAttribute('x1', r.dataset.x); xh.setAttribute('x2', r.dataset.x); xh.setAttribute('opacity', .6); };
  svg.querySelectorAll('.hit').forEach(r => { r.addEventListener('mouseenter', () => show(r)); r.addEventListener('touchstart', () => show(r), {passive:true}); });
  svg.addEventListener('mouseleave', () => { tip.style.opacity = 0; xh.setAttribute('opacity', 0); });
}

function loadDemo(){
  const plan = [
    { key:'demo_a', items:[['ex_leg-press-45',3,10,160,10],['ex_agachamento-livre',4,8,60,2.5],['ex_cadeira-extensora',3,12,40,2.5],['ex_mesa-flexora',3,12,35,2.5],['ex_panturrilha-em-pe',4,15,60,5]] },
    { key:'demo_b', items:[['ex_supino-reto-barra',4,8,50,2.5],['ex_supino-inclinado-halteres',3,10,20,1],['ex_crucifixo-peck-deck',3,12,35,2.5],['ex_triceps-corda-polia',3,12,25,1.25]] },
    { key:'demo_c', items:[['ex_puxada-frontal-pulldown',4,10,50,2.5],['ex_remada-baixa-cabo',3,10,45,2.5],['ex_rosca-direta',3,10,24,1],['ex_abdominal-na-polia',3,15,30,2.5]] },
  ];
  const workouts = plan.map(p => ({ id:uid('wk'), name:t(p.key), nameKey:p.key, createdAt:Date.now(), items:p.items.map(([exerciseId,sets,reps,load])=>({exerciseId,sets,reps,load})) }));
  const sessions = []; const start = new Date(); start.setDate(start.getDate() - 7*8 + 1);
  for(let week=0; week<8; week++) plan.forEach((p,pi) => {
    const d = new Date(start); d.setDate(d.getDate() + week*7 + pi*2);
    if(d > new Date()) return;
    sessions.push({ id:uid('ss'), date:d.toISOString().slice(0,10), workoutId:workouts[pi].id, startedAt:d.getTime(), finishedAt:d.getTime()+3600e3,
      entries:p.items.map(([exerciseId,sets,reps,load,inc]) => { const base = load + inc*Math.floor(week*0.75 + (week%3===2?0:0.3));
        // semanas ímpares: compostos em 5 reps com mais carga; semana 7: teste de 1RM no supino
        if(week === 7 && exerciseId === 'ex_supino-reto-barra') return { exerciseId, sets:1, reps:1, load: Math.round(base*1.3/2.5)*2.5 };
        if(week % 2 === 1 && ['ex_agachamento-livre','ex_supino-reto-barra','ex_leg-press-45','ex_puxada-frontal-pulldown'].includes(exerciseId)) return { exerciseId, sets, reps:5, load: Math.round(base*1.15/2.5)*2.5 };
        if(week % 4 === 2 && exerciseId === 'ex_cadeira-extensora') return { exerciseId, sets, reps:15, load: Math.round(base*0.8/2.5)*2.5 };
        return { exerciseId, sets, reps, load:base }; }) });
  });
  workouts.forEach(w => { const last = sessions.filter(s=>s.workoutId===w.id).pop(); if(last) w.items.forEach(it => { const e = last.entries.find(x=>x.exerciseId===it.exerciseId); if(e) it.load = e.load; }); });
  S.workouts.push(...workouts); S.sessions.push(...sessions); save(); syncPersonProps();
  track('demo_data_loaded', { sessions_added:sessions.length, workouts_added:workouts.length });
  toast(t('demo_loaded')); location.hash = '#mapa'; route();
}

const SCREEN_EN = { mapa:'map', treinos:'workouts', historico:'progress', exercicios:'exercises' };

document.addEventListener('click', ev => {
  const stepBtn = ev.target.closest('[data-step]');
  if(stepBtn){ const inp = stepBtn.parentElement.querySelector('input'); inp.value = Math.max(0, Math.round(((+inp.value||0) + (+stepBtn.dataset.step))*100)/100); return; }
  const el = ev.target.closest('[data-action]');
  const mEl = ev.target.closest('.m');
  if(mEl && !el){ const m = mEl.dataset.m; ui.selected = (ui.selected === m) ? null : m; viewMapa();
    if(ui.selected) { track('muscle_selected', { muscle:m, view: mEl.closest('svg').dataset.view, range_days:ui.range, rep_range:ui.band });
      if(window.innerWidth < 820) document.getElementById('musclePanel').scrollIntoView({behavior:'smooth', block:'start'}); }
    return; }
  if(!el) return;
  const a = el.dataset.action;
  if(a === 'scrim'){ if(ev.target === el){ if(!S.settings.onboarded){ S.settings.onboarded = true; save(); track('onboarding_dismissed'); } closeModal(); } return; }
  if(a === 'close') return closeModal();
  if(a === 'toggle-lang') return switchLang(LANG === 'en' ? 'pt' : 'en', 'header');
  if(a === 'set-lang') return switchLang(el.dataset.lang, 'settings');
  if(a === 'band'){ ui.band = el.dataset.band; track('rep_range_filter_changed', { context:'map', rep_range:ui.band }); return viewMapa(); }
  if(a === 'range'){ ui.range = +el.dataset.days; track('heatmap_range_changed', { range_days:ui.range }); return viewMapa(); }
  if(a === 'new-workout') return openWorkoutEditor();
  if(a === 'edit-workout') return openWorkoutEditor(el.dataset.id);
  if(a === 'start-session') return openSession({ workoutId: el.dataset.id || null, source: el.dataset.id ? 'workout' : 'quick' });
  if(a === 'edit-session') return openSession({ sessionId: el.dataset.id });
  if(a === 'open-exercise'){ closeModal(); return openExercise(el.dataset.id); }
  if(a === 'new-exercise') return openExerciseEditor(null, el.dataset.muscle);
  if(a === 'open-debug') return openDebug();
  if(a === 'show-all'){ ui.showAll = true; return viewHistorico(); }
  if(a === 'open-backup') return openBackup();
  if(a === 'drive-backup') return withDrive(() => { S.settings.backupPending = false; uploadBackup('manual'); });
  if(a === 'drive-restore') return withDrive(startRestore);
  if(a === 'drive-auto'){ S.settings.autoBackup = el.checked; save(); track('auto_backup_toggled', { enabled:el.checked }); return; }
  if(a === 'export') return exportBackup();
  if(a === 'demo') return loadDemo();
  if(a === 'save-name'){ const n = document.getElementById('userName').value.trim(); S.user.name = n; save();
    identifyUser();
    track('profile_updated', { has_name: !!n }); return toast(n ? t('hello',{n}) : t('name_removed')); }
  if(a === 'reset') return confirmBox(t('confirm_reset'), t('delete_all'), () => {
    const user = S.user, st = S.settings; S = migrate(freshState()); S.user = user; S.settings = st; save(); syncPersonProps(); track('data_reset'); route(); });
});
document.addEventListener('keydown', e => { if(e.key === 'Escape') closeModal(); });

initAnalytics();
applyStatic();
loadGIS();
route();
renderDriveStatus();
if(!S.settings.onboarded) openOnboarding();
// PWA: cache offline (https, ex.: GitHub Pages; ou localhost para testar)
if('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')){
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
const standalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
PH() && PH().register({ display_mode: standalone ? 'standalone' : 'browser' });
window.addEventListener('appinstalled', () => track('app_installed'));
</script>
</body>
</html>
